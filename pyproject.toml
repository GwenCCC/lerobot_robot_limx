[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_limx"
version = "0.1.0"
description = "LeRobot plugin for LimX Dynamics robots: Oli, Luna, TRON1 and TRON2"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "LimX Dynamics", email = "opensource@limxdynamics.com" }]
keywords = ["robotics", "lerobot", "limx", "humanoid", "legged", "teleoperation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot>=0.4",
    # The vendor SDK is required by every driver here and ships wheels for Linux and
    # Windows only, so it is a hard dependency everywhere else.
    "limxsdk>=4.1.0,<5.0.0 ; sys_platform != 'darwin'",
    # TRON2 talks to the robot through LimX's public runtime instead of the low-level SDK.
    "tron2-env>=0.1.0,<0.2.0 ; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.1.0", "pytest-timeout>=2.4.0", "ruff==0.14.1"]

[project.urls]
Homepage = "https://github.com/limxdynamics/lerobot_robot_limx"
Issues = "https://github.com/limxdynamics/lerobot_robot_limx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"

# Mirrors lerobot's own rule set, so the drivers keep the style they were written in and
# can be moved between the two repos without a reformat.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM", "D"]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402", "D104"]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot_robot_limx"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
